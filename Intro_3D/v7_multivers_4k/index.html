<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trailer V7 — Multivers → Ring</title>
<link rel="icon" href="data:,">  <!-- V7.1 : pas de requête /favicon.ico (404 dans Chrome avec fenêtre, rendu GPU du PC) -->
<style>
  :root { --fond: #05040a; --panneau: rgba(16,14,26,.86); --bord: #3c3150; --or: #ffc83d; --texte: #f1eadf; }
  html, body { margin: 0; height: 100%; background: var(--fond); color: var(--texte); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  #vue { position: fixed; inset: 0 0 92px 0; display: grid; place-items: center; }
  #sortie { display: block; max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; background: #000; }
  #info { position: fixed; left: 12px; top: 12px; background: var(--panneau); border: 1px solid var(--bord); border-radius: 10px; padding: 8px 12px; max-width: min(620px, calc(100% - 24px)); }
  #info b { color: var(--or); }
  #barre { position: fixed; left: 0; right: 0; bottom: 0; height: 92px; background: #0b0a12; border-top: 1px solid var(--bord); padding: 8px 12px; box-sizing: border-box; }
  #controles { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
  button { background: #1a1726; color: var(--texte); border: 1px solid var(--bord); border-radius: 8px; padding: 4px 10px; cursor: pointer; font: inherit; }
  #frise { position: relative; height: 40px; background: #12101c; border-radius: 6px; cursor: pointer; overflow: hidden; }
  .acte { position: absolute; top: 0; bottom: 0; border-right: 1px solid #000; opacity: .8; font-size: 11px; padding: 2px 4px; box-sizing: border-box; }
  .ecurie { position: absolute; bottom: 0; height: 12px; border-right: 1px solid #000; }
  #tete { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--or); box-shadow: 0 0 8px var(--or); }
  #erreur { position: fixed; inset: 0; display: none; place-items: center; background: #200; color: #fbb; padding: 30px; white-space: pre-wrap; z-index: 9; }
  #charge { position: fixed; inset: 0; display: grid; place-items: center; background: #05040a; z-index: 5; font-size: 18px; }
  body.capture #info, body.capture #barre, body.capture #charge { display: none; } body.capture #vue { inset: 0; }
</style>
</head>
<body>
<div id="vue"><canvas id="sortie"></canvas></div>
<div id="info">Chargement du trailer V7…</div>
<div id="charge">Chargement…</div>
<div id="barre">
  <div id="controles">
    <button id="lecture">▶ Lecture (Espace)</button><button id="debut">⏮ Début</button><span id="temps">0,00 s</span>
    <span style="opacity:.6">← → : image · Maj + ← → : 1 s · PgPréc / PgSuiv : acte · M : son</span>
  </div>
  <div id="frise"><div id="tete"></div></div>
</div>
<div id="erreur"></div>
<audio id="son" preload="none"></audio>
<script type="module">
import '../src/shared_bridge.js';
import { urlWeb } from '../src/shared_bridge.js';
import { creerFilm } from './film_v7.js';
const THREE = window.THREE, q = new URLSearchParams(location.search);
const err = (e) => { const d = document.getElementById('erreur'); d.style.display = 'grid'; d.textContent = 'Erreur : ' + (e && e.stack || e); console.error(e); window.erreurFilm = String(e && e.stack || e); };
window.addEventListener('error', (ev) => err(ev.error || ev.message)); window.addEventListener('unhandledrejection', (ev) => err(ev.reason));
(async () => {
  try {
    const capture = q.has('capture'); if (capture) document.body.classList.add('capture');
    const qualite = q.get('qualite') || (capture ? 'brouillon' : 'apercu');
    const L = parseInt(q.get('l') || (capture ? 960 : 1280), 10), H = Math.round(L * 9 / 16), SUB = parseInt(q.get('sub') || '1', 10);
    const plan = await (await fetch('data/plan_v7.json', { cache: 'no-store' })).json();
    const { equipes, logos } = await (async () => { const eq = await (await fetch(urlWeb('data/teams.json'))).json(); const lg = {}; await Promise.all(eq.map((e) => new Promise((ok) => { const im = new Image(); im.onload = () => { lg[e.id] = im; ok(); }; im.onerror = () => { console.info('Logo absent : ' + e.id); lg[e.id] = null; ok(); }; im.src = urlWeb(`logos/${String(e.id).padStart(2, '0')}.jpg`); }))); return { equipes: eq, logos: lg }; })();
    const regles = await (await fetch(urlWeb('data/rules.json'))).json();
    const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(1); renderer.setSize(L, H, false);
    const sortie = document.getElementById('sortie'); sortie.width = L; sortie.height = H;
    if (capture) sortie.getContext('2d', { willReadFrequently: true });   // V7.1 : relecture image par image (toDataURL) sans aller-retour GPU
    const info = document.getElementById('info'), charge = document.getElementById('charge');
    const film = await creerFilm({ renderer, equipes, logos, regles, plan, sortie, qualite, parcMax: parseInt(q.get('parc') || (qualite === 'master' ? '60' : '24'), 10), progression: (m) => { charge.textContent = m; }, capture });
    window.filmV7 = film; window.dureeFilm = film.duree; window.fpsFilm = film.fps; window.reperesPlanche = film.reperesPlanche; window.reperesPlanche48 = film.reperesPlanche48; window.inventaireFilm = film.inventaire;
    window.rendreTemps = (t, o = {}) => film.rendreTemps(t, { sub: o.sub ?? SUB });
    window.imageBase64 = (format = 'png', qual = 0.97) => sortie.toDataURL(format === 'jpeg' ? 'image/jpeg' : 'image/png', qual).split(',')[1];
    window.sondePhysique = (k, t) => film.sondePhysique(k, t);
    console.info('Trailer V7 :', JSON.stringify(film.inventaire));
    charge.style.display = 'none';
    // frise : actes + écuries
    const frise = document.getElementById('frise'), tete = document.getElementById('tete'), temps = document.getElementById('temps');
    const couleurs = { I: '#5a3a8a', II: '#1d4fd8', III: '#2a8a5a', IV: '#8a2a2a', V: '#8a6a1a', VI: '#c46b2a' };
    for (const a of film.tl.actes) { const d = document.createElement('div'); d.className = 'acte'; d.textContent = a.id; d.title = a.titre; d.style.left = (a.debut / film.duree * 100) + '%'; d.style.width = ((a.fin - a.debut) / film.duree * 100) + '%'; d.style.background = couleurs[a.id]; frise.appendChild(d); }
    for (const s of film.tl.ecuries) { const d = document.createElement('div'); d.className = 'ecurie'; d.style.left = (s.debut / film.duree * 100) + '%'; d.style.width = ((s.fin - s.debut) / film.duree * 100) + '%'; d.style.background = equipes[s.k].colors[1]; d.title = equipes[s.k].name; frise.appendChild(d); }
    frise.appendChild(tete);
    const son = document.getElementById('son'); let sonCharge = false;
    let t = parseFloat(q.get('t') || '0'), lecture = false, occupe = false, t0 = 0, tRef = 0;
    const afficher = async () => { if (occupe) return; occupe = true; try { const e = await film.rendreTemps(t, { sub: 1 }); tete.style.left = (t / film.duree * 100) + '%'; temps.textContent = t.toFixed(2).replace('.', ',') + ' s / ' + film.duree.toFixed(0) + ' s'; info.innerHTML = `<b>${e.acte.id}</b> · ${e.acte.titre}${e.slot ? '<br><span style="opacity:.7">écurie ' + e.slot.id + ' · phase ' + e.phase + ' · vague ' + e.slot.vague + '</span>' : ''}`; } finally { occupe = false; } };
    const aller = (nt) => { t = Math.max(0, Math.min(film.duree - 1 / 60, nt)); if (lecture) { tRef = t; t0 = performance.now(); if (sonCharge) son.currentTime = t; } afficher(); };
    const boucle = () => { if (lecture) { t = Math.min(film.duree - 1 / 60, tRef + (performance.now() - t0) / 1000); afficher(); if (t >= film.duree - 1 / 60) lecture = false; } requestAnimationFrame(boucle); };
    const basculer = async () => { lecture = !lecture; document.getElementById('lecture').textContent = lecture ? '⏸ Pause (Espace)' : '▶ Lecture (Espace)'; if (lecture) { tRef = t; t0 = performance.now(); if (!sonCharge) { sonCharge = true; son.onerror = () => { info.innerHTML += '<br>Bande-son absente : lancer sound_v7_crescendo.py'; }; son.src = 'audio/mix_v7.wav'; } son.currentTime = t; try { await son.play(); } catch { } } else son.pause(); };
    document.getElementById('lecture').onclick = basculer; document.getElementById('debut').onclick = () => aller(0);
    frise.onclick = (e) => { const r = frise.getBoundingClientRect(); aller((e.clientX - r.left) / r.width * film.duree); };
    addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); basculer(); } else if (e.code === 'ArrowRight') aller(t + (e.shiftKey ? 1 : 1 / 60)); else if (e.code === 'ArrowLeft') aller(t - (e.shiftKey ? 1 : 1 / 60)); else if (e.code === 'PageDown') aller((film.tl.actes.find((a) => a.debut > t + 0.01) || { debut: 0 }).debut); else if (e.code === 'PageUp') aller([...film.tl.actes].reverse().find((a) => a.debut < t - 0.5)?.debut ?? 0); else if (e.code === 'KeyM') son.muted = !son.muted; });
    await film.rendreTemps(t, { sub: capture ? SUB : 1 }); if (!capture) { afficher(); boucle(); }
    window.pret = true;
  } catch (e) { err(e); }
})();
</script>
</body>
</html>
