<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b1e">
<title>Régie — Grand Prix de Noël</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/nintendo.css">
<script>/* habillage : « nintendo » (défaut) ou « neon » ; ?skin=neon pour changer */try{var k=new URLSearchParams(location.search).get("skin");if(k)localStorage.setItem("gp.skin",k);document.documentElement.dataset.skin=localStorage.getItem("gp.skin")||"nintendo"}catch(e){document.documentElement.dataset.skin="nintendo"}</script>
<style>
html,body{overflow:auto}
#wrap{max-width:560px;margin:0 auto;padding:14px 14px 60px;position:relative;z-index:5;font-size:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
header b{font:700 20px var(--font-display);letter-spacing:.08em;text-transform:uppercase}
.links a{color:var(--ice);font-size:13px;margin-left:10px}
#st{font-size:12px;color:var(--ink-dim);margin-bottom:10px}
#toasts{position:fixed;left:0;right:0;top:12px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:90;pointer-events:none}
.toast{padding:10px 18px;border-radius:14px;background:rgba(12,19,49,.97);border:1px solid var(--hair);font-size:14px;animation:pop .3s both}.toast.err{border-color:var(--red);color:#ffd0d6}
</style>
</head>
<body>
<canvas id="atmo"></canvas><div class="vignette"></div>
<div id="wrap">
  <header><b class="foil">Régie</b><span class="links"><a id="lt" href="../tv/">TV</a><a id="lp" href="../pit/">Pit</a></span></header>
  <div id="st">Connexion…</div>
  <div class="deco" style="padding:16px"><div id="adm"></div></div>
</div>
<div id="toasts"></div>
<script type="module" src="regie.js"></script>
</body>
</html>
