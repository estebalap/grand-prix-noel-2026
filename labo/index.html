<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Labo des pièges — Grand Prix de Noël</title>
<link rel="stylesheet" href="../shared/tokens.css">

    <div id="hud"><span id="ral">Ralenti ×40</span><span id="etat">Armé</span><button id="go" type="button">DÉCLENCHER</button><span id="score"></span></div>
