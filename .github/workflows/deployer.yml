name: Deployer le site
on:
  push:
    paths: ['_deploiement/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remplacer le site par les archives
        run: |
          set -e
          ls _deploiement/*.zip
          mkdir /tmp/site
          for z in _deploiement/*.zip; do unzip -o -q "$z" -d /tmp/site; done
          test -f /tmp/site/index.html
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name README.md -exec rm -rf {} +
          cp -a /tmp/site/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898599+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Site : contenu remplacé par pages_build (sans les sons sous droits)" || echo "rien à changer"
          git push
